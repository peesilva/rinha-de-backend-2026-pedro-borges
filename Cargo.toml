[package]
name = "fraud-api"
version = "0.1.0"
edition = "2021"

[lib]
name = "fraud_api"
path = "src/lib.rs"

[[bin]]
name = "build-index"
path = "src/build_index.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
memmap2 = "0.9"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true