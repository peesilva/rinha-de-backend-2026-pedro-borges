services:

  nginx:
    image: nginx:1.27-alpine
    container_name: rinha-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    networks:
      - rinha-net
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"

  api1:
    image: ghcr.io/peesilva/fraud-api:latest
    container_name: rinha-api1
    environment:
      PORT: "8080"
      INDEX_PATH: "/data/index.bin"
      TOKIO_WORKER_THREADS: "2"
    networks:
      - rinha-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ready 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "155MB"

  api2:
    image: ghcr.io/peesilva/fraud-api:latest
    container_name: rinha-api2
    environment:
      PORT: "8080"
      INDEX_PATH: "/data/index.bin"
      TOKIO_WORKER_THREADS: "2"
    networks:
      - rinha-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ready 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "155MB"

networks:
  rinha-net:
    driver: bridge