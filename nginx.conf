# Nginx as a pure round-robin load balancer
# No inspection, no transformation, no business logic

worker_processes 1;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # Upstream: round-robin between two API instances
    upstream fraud_api {
        server api1:8080;
        server api2:8080;
        keepalive 128;        # persistent connections to backends
    }

    # Tuning for low latency
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  10000;

    # No access log — reduces I/O, improves p99
    access_log off;
    error_log  /dev/stderr warn;

    # Gzip off — JSON responses are small, compression adds latency
    gzip off;

    server {
        listen 9999 reuseport;

        location / {
            proxy_pass         http://fraud_api;
            proxy_http_version 1.1;

            # Keep connections alive to backends
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;

            # Timeouts: generous enough for startup, tight for runtime
            proxy_connect_timeout  5s;
            proxy_send_timeout     10s;
            proxy_read_timeout     10s;

            # Buffer tuning — small enough to not add latency
            proxy_buffering    off;
            proxy_buffer_size  4k;
        }
    }
}
